name: Sync Upstream

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync with upstream
        run: |
          # 添加上游仓库
          git remote add upstream https://github.com/THU-MAIC/OpenMAIC.git
          git fetch upstream
          
          # 尝试合并
          if git merge upstream/main --allow-unrelated-histories --no-edit; then
            echo "✅ 合并成功，推送中..."
            git push origin main
          else
            echo "⚠️ 合并冲突，尝试使用策略"
            # 中止当前合并
            git merge --abort
            # 使用rebase方式（保留你的提交在上层）
            git rebase upstream/main
            if [ $? -eq 0 ]; then
              git push origin main --force-with-lease
              echo "✅ 使用rebase同步成功"
            else
              echo "❌ 同步失败，需要手动处理"
              git rebase --abort
              exit 1
            fi
          fi
